name: Import Verified JCF v0.9.0 Source From Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jcf-source-import-v090
  cancel-in-progress: false
jobs:
  source-import:
    if: github.actor == 'nigelebrown' && (github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v0.9.0-source')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download exact approved source asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jcf"
          gh release download 'v0.9.0-source' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'JCF_ArubaNetworkManager_v0_9_0_Public_Release.zip' \
            --dir "$RUNNER_TEMP/jcf"
          echo '7a33c77736ae8d13f8bdef4b95d34c37bd4e74c36e0f9e1a706ce938aa94d2e9  '"$RUNNER_TEMP/jcf/JCF_ArubaNetworkManager_v0_9_0_Public_Release.zip" | sha256sum -c -
      - name: Extract reviewed application paths only
        env:
          ARCHIVE: ${{ runner.temp }}/jcf/JCF_ArubaNetworkManager_v0_9_0_Public_Release.zip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, stat, zipfile, re
          path=Path(os.environ['ARCHIVE'])
          prefix='ArubaNetworkManager/'
          roots={'Dockerfile','.dockerignore','.gitignore','README.md','CHANGELOG.md',
                 'INSTALL_DOCKER_CENTOS9.sh','Jcf.NetworkManager.slnx',
                 'compose.yaml','compose.pilot.yaml','compose.migrate.yaml',
                 '.config/dotnet-tools.json','docs/README_DOCKER.md','RELEASE_SOURCE_SHA256.md'}
          dirs=('src/','tests/','scripts/','deploy/docker/')
          extracted=[]
          with zipfile.ZipFile(path) as z:
            for item in z.infolist():
              if item.is_dir():continue
              if not item.filename.startswith(prefix):raise SystemExit('Unexpected ZIP root: '+item.filename)
              rel=item.filename[len(prefix):]
              if not rel or rel.startswith('/') or '\\' in rel or '..' in PurePosixPath(rel).parts:
                raise SystemExit('Unsafe archive member')
              if not (rel in roots or rel.startswith(dirs)):
                raise SystemExit('Disallowed file path: '+rel)
              if (item.external_attr>>16)&0o170000 == stat.S_IFLNK:
                raise SystemExit('Symlink in release archive refused')
              data=z.read(item)
              # Block newly injected credentials, live JCF addresses and binary files.
              if b'\x00' in data or len(data)>200000:
                raise SystemExit('Unexpected binary or oversized file: '+rel)
              if re.search(rb'(gh[pousr]_[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{12,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----)',data):
                raise SystemExit('Potential secret in release: '+rel)
              if re.search(rb'\b10\.(?:190|101|102|103)\.', data):
                raise SystemExit('JCF-address fixture not sanitized: '+rel)
              target=Path(rel)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              extracted.append(rel)
          if len(extracted)<100:raise SystemExit('Source archive incomplete')
          proj=Path('src/Jcf.NetworkManager/Jcf.NetworkManager.csproj').read_text()
          if '<Version>0.9.0</Version>' not in proj:raise SystemExit('Wrong app version')
          for p in ['Dockerfile','compose.yaml','INSTALL_DOCKER_CENTOS9.sh',
                    'src/Jcf.NetworkManager/Program.cs','tests/DeviceIntegrationTests.cs']:
            if not Path(p).is_file():raise SystemExit('Missing mandatory source: '+p)
          print('Verified and imported',len(extracted),'source files.')
          PY
      - name: Verify installation scripts and offline regression tests
        run: |
          set -euo pipefail
          bash -n INSTALL_DOCKER_CENTOS9.sh
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 -m unittest discover -s deploy/docker/tests -p 'test_*.py' -v
          python3 scripts/TEST_REAL_PILOT_CLIENT_OFFLINE.py
      - name: Commit complete application source to main
        run: |
          set -euo pipefail
          git config user.name 'jcf-release-import[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src tests scripts deploy/docker .config/dotnet-tools.json \
            Dockerfile .dockerignore .gitignore README.md CHANGELOG.md \
            INSTALL_DOCKER_CENTOS9.sh Jcf.NetworkManager.slnx \
            compose.yaml compose.pilot.yaml compose.migrate.yaml \
            docs/README_DOCKER.md RELEASE_SOURCE_SHA256.md
          if git diff --cached --quiet; then
            echo 'v0.9.0 source already matches main.'
            exit 0
          fi
          git commit -m 'Release JCF Network Manager 0.9.0: Docker + offline AI source'
          git push origin HEAD:main
          echo 'Complete v0.9.0 source published to main.'
