name: Codex - Application-only review
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 8 * * *'
permissions:
  contents: read
concurrency:
  group: jcf-codex-app-only
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require GitHub Actions OpenAI key secret
        env:
          REVIEW_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$REVIEW_KEY" ]; then
            echo 'Configure the OPENAI_API_KEY repository Actions secret to enable AI feedback.' >&2
            exit 1
          fi
      - name: Review application source only
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/APP_ONLY_REVIEW.md
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: codex-app-review.md
      - name: Upload review findings for human action
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-review
          path: codex-app-review.md
          if-no-files-found: ignore
          retention-days: 14
